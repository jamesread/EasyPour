# Marketing screenshots, captured by `make` in this directory against the
# throwaway instance it starts (see Makefile / seed/).
#
# title/description/theme are not used by repo-helper; `make manifest` turns
# them into screenshot-manifest.yaml for indexers. Every section needs them.

[DEFAULT]
base_url = http://127.0.0.1:18480/
dir = .
width = 1280
height = 800
script = scripts/light.py, scripts/login.py, scripts/prepare.py
post_script_sleep = 1.5
theme = light
manifest_project = EasyPour
manifest_base_url = https://raw.githubusercontent.com/jamesread/EasyPour/main/var/marketing/screenshots/

[menu]
url = .
title = Menu
description = Browse drinks and snacks grouped by category, pick sugar and milk, and add them to a basket to send in one order.

[my-orders]
url = orders
title = My orders
description = Follow each of your orders from pending to preparing to delivered, with live status updates.

[admin-orders]
url = admin/orders
title = Order queue
description = Staff see every order in one place and move them through preparing and delivered as they make them.

[kitchen]
url = admin/kitchen
title = Kitchen view
description = Totals of every item across open orders, so whoever is making the round knows exactly what to prepare.

[settings]
url = admin/settings
title = Settings
description = Name your site and set an Apprise URL so new orders ping your phone, chat or smart speaker.

