syntax = "proto3";

package easypour.v1;

import "google/protobuf/empty.proto";

option go_package = "easypour/service/gen/easypour/v1;easypourv1";

// OrderRequest represents a request to order a menu item (beverage or food)
message OrderRequest {
  string menu_item_id = 1;  // id of the menu item being ordered
  bool add_sugar = 2;
  bool add_milk = 3;
  int32 sugar_amount = 4; // Optional: number of sugar packets/spoons
  int32 milk_amount = 5;  // Optional: amount of milk (percentage or ml)
  string group_id = 6;    // Optional: shared id for multi-item basket orders; empty = order_id
}

// OrderResponse represents the response after placing an order (used for OrderDrink creation).
message OrderResponse {
  string order_id = 1;
  string menu_item_id = 2;  // id of the menu item that was ordered
  bool add_sugar = 3;
  bool add_milk = 4;
  int32 sugar_amount = 5;
  int32 milk_amount = 6;
  string status = 7; // e.g., "pending", "preparing", "delivered"
  int64 created_at = 8; // Unix timestamp
  string group_id = 9;  // shared id for multi-item basket orders
}

// Order is a persisted order (includes username for ownership). Used by GetOrder, ListOrders, UpdateOrderStatus.
message Order {
  string order_id = 1;
  string menu_item_id = 2;
  string username = 3;  // order owner; empty when auth disabled
  bool add_sugar = 4;
  bool add_milk = 5;
  int32 sugar_amount = 6;
  int32 milk_amount = 7;
  string status = 8;   // "pending", "preparing", "delivered"
  int64 created_at = 9;
  int64 updated_at = 10;
  string group_id = 11; // shared id for multi-item basket orders
}

// GetOrderRequest requests a single order by id. Requires auth; returns own order or admin sees any.
message GetOrderRequest {
  string order_id = 1;
}

// GetOrderResponse returns the order when found and caller has permission.
message GetOrderResponse {
  Order order = 1;
}

// ListOrdersRequest lists orders. Requires auth; regular users see own, admins see all.
message ListOrdersRequest {}

// ListOrdersResponse returns the list of orders (filtered by backend).
message ListOrdersResponse {
  repeated Order orders = 1;
}

// UpdateOrderStatusRequest updates an order's status. Requires auth; permissions enforced by backend.
message UpdateOrderStatusRequest {
  string order_id = 1;
  string status = 2;   // "pending", "preparing", "delivered"
}

// UpdateOrderStatusResponse returns the updated order.
message UpdateOrderStatusResponse {
  Order order = 1;
}

// MenuItem represents an item in the menu (beverage, food, etc.)
message MenuItem {
  string id = 6;  // stable id for edit/delete; backend assigns on create
  string name = 2;
  string description = 3;
  bool supports_sugar = 4;
  bool supports_milk = 5;
  string image_url = 7;  // URL path to item image, e.g. /images/item-abc.jpg
  string category = 8;   // e.g. "Drinks", "Food"; used to group items in the menu
}

// GetMenuRequest is a request to get the menu
message GetMenuRequest {}

// GetMenuResponse contains the menu items
message GetMenuResponse {
  repeated MenuItem items = 1;
}

// CreateMenuItemRequest creates a new menu item (admin only)
message CreateMenuItemRequest {
  MenuItem item = 1;  // id may be empty; backend assigns
}

// UpdateMenuItemRequest updates an existing menu item (admin only)
message UpdateMenuItemRequest {
  MenuItem item = 1;  // item.id must be set
}

// DeleteMenuItemRequest deletes a menu item by id (admin only)
message DeleteMenuItemRequest {
  string id = 1;
}

// InitRequest is a request for app bootstrap data (version, OAuth providers).
message InitRequest {}

// InitResponse returns app version and configured OAuth2 providers for the login form.
message InitResponse {
  string version = 1;
  repeated OAuthProvider oauth_providers = 2;
}

// GetCurrentUserRequest is a request for the current user (when auth is enabled)
message GetCurrentUserRequest {}

// OAuthProvider describes a configured OAuth2 login provider for the login form
message OAuthProvider {
  string id = 1;       // provider id, e.g. "google", "github"
  string name = 2;     // display name, e.g. "Google", "GitHub"
  string auth_url = 3; // URL to start OAuth2 flow (redirect or link)
}

// GetCurrentUserResponse returns the authenticated user when auth is enabled,
// and the list of configured OAuth2 providers for the login form (callable unauthenticated).
message GetCurrentUserResponse {
  bool is_authenticated = 1;
  string username = 2;
  bool is_admin = 3;  // true when user is in the "admin" user group
  repeated OAuthProvider oauth_providers = 4;
}

// Settings holds runtime-configurable application settings (admin only).
message Settings {
  // Apprise API notify URL, e.g. http://localhost:8000/notify/ or http://localhost:8000/notify/mytag.
  // When set, EasyPour POSTs title/body JSON to this URL on each new order.
  string apprise_url = 1;
}

// GetSettingsRequest fetches current settings. Admin only.
message GetSettingsRequest {}

// GetSettingsResponse returns the current settings.
message GetSettingsResponse {
  Settings settings = 1;
}

// UpdateSettingsRequest updates settings. Admin only.
message UpdateSettingsRequest {
  Settings settings = 1;
}

// UpdateSettingsResponse returns the saved settings.
message UpdateSettingsResponse {
  Settings settings = 1;
}

// TestAppriseNotificationRequest sends a test notification via Apprise. Admin only.
// If apprise_url is set, that URL is used; otherwise the saved settings URL is used.
message TestAppriseNotificationRequest {
  string apprise_url = 1;
}

// TestAppriseNotificationResponse confirms the test notification was sent.
message TestAppriseNotificationResponse {
  string message = 1;
}

// EasyPourService provides methods for the menu and orders
service EasyPourService {
  // Init returns app version and configured OAuth2 providers. Callable unauthenticated on load.
  rpc Init(InitRequest) returns (InitResponse) {}

  // GetMenu returns the menu (beverages, food, etc.)
  rpc GetMenu(GetMenuRequest) returns (GetMenuResponse) {}

  // OrderDrink places an order for a menu item
  rpc OrderDrink(OrderRequest) returns (OrderResponse) {}

  // GetCurrentUser returns the authenticated user when auth is enabled
  rpc GetCurrentUser(GetCurrentUserRequest) returns (GetCurrentUserResponse) {}

  // CreateMenuItem adds a menu item (admin only). Item id is assigned by the server.
  rpc CreateMenuItem(CreateMenuItemRequest) returns (MenuItem) {}

  // UpdateMenuItem updates a menu item (admin only).
  rpc UpdateMenuItem(UpdateMenuItemRequest) returns (MenuItem) {}

  // DeleteMenuItem removes a menu item by id (admin only).
  rpc DeleteMenuItem(DeleteMenuItemRequest) returns (google.protobuf.Empty) {}

  // GetOrder returns a single order by id. Requires auth; caller must own order or be admin.
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse) {}

  // ListOrders returns orders for the caller (own orders) or all orders if admin. Requires auth.
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse) {}

  // UpdateOrderStatus updates an order's status. Requires auth; admin can set preparing/delivered, user can set delivered for own orders.
  rpc UpdateOrderStatus(UpdateOrderStatusRequest) returns (UpdateOrderStatusResponse) {}

  // GetSettings returns runtime settings (admin only).
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse) {}

  // UpdateSettings updates runtime settings (admin only).
  rpc UpdateSettings(UpdateSettingsRequest) returns (UpdateSettingsResponse) {}

  // TestAppriseNotification sends a test Apprise notification (admin only).
  rpc TestAppriseNotification(TestAppriseNotificationRequest) returns (TestAppriseNotificationResponse) {}
}