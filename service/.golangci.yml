# Matches the jwr-soa-baseline lint ruleset enforced by gauntlet.
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - bidichk
    - bodyclose
    - copyloopvar
    - durationcheck
    - errcheck
    - errorlint
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - misspell
    - modernize
    - nilerr
    - noctx
    - staticcheck
    - testifylint
    - thelper
    - unconvert
    - unparam
    - unused
    - usestdlibvars
  settings:
    gocyclo:
      # gocyclo reports complexity > min-complexity, so 4 enforces the jwr-soa-2.0 limit of 4.
      min-complexity: 4
    gosec:
      enable-all-rules: true
    govet:
      enable-all: true
      disable:
        - fieldalignment
  exclusions:
    paths:
      - gen
    rules:
      - path: _test\.go
        linters:
          - gosec
